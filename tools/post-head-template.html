<!-- Head block for a new post. Keep the twitter:* order exactly: card, title, description, image. -->
<title>{TITLE}</title>
<meta name="description" content="{DESC}">
<link rel="canonical" href="https://dtcolligan.com/posts/{SLUG}/">
<meta property="og:title" content="{TITLE}">
<meta property="og:description" content="{DESC}">
<meta property="og:site_name" content="dtcolligan.com">
<meta property="og:type" content="article">
<meta property="og:url" content="https://dtcolligan.com/posts/{SLUG}/">
<meta property="og:image" content="https://dtcolligan.com/assets/cards/card-{SLUG}-{HASH}.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{TITLE} — dtcolligan.com">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{TITLE}">
<meta name="twitter:description" content="{DESC}">
<meta name="twitter:image" content="https://dtcolligan.com/assets/cards/sq-{SLUG}-{HASH}.png">
<link rel="alternate" type="application/atom+xml" title="Dom Colligan — Atom Feed" href="/feeds/atom.xml">
<link rel="stylesheet" href="/assets/style.css?v=tmalign1">
